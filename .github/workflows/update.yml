name: Update data and publish

on:
  schedule:
    # Every 15 minutes: GitHub often delays or drops scheduled runs, so ask often enough that some get through
    # soon after Elering publishes tomorrow's prices (around 14:00 Tallinn time).
    - cron: "7,22,37,52 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # Room for the wait for tomorrow's prices (at most 5 h 30 min) plus the rest of the job.
    timeout-minutes: 350
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # GitHub starts scheduled runs only every few hours, so a run that lands before Elering publishes
      # tomorrow's prices waits for them instead of leaving them to the next run in the evening.
      - name: Wait for tomorrow's prices
        run: python scripts/wait_tomorrow.py

      - name: Fetch prices and forecast
        run: python scripts/fetch.py

      - name: Save new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json weather.json
          git diff --cached --quiet || (git commit -m "Update data" && git pull --rebase && git push)

      - name: Build site
        run: |
          mkdir -p _site
          cp -r index.html manifest.webmanifest icons prices.json weather.json _site/

      # Photos come from a Google Drive folder, are encrypted with the photo password and go only into the
      # published site, never into the repository. Skipped until the three secrets are set.
      - name: Encrypt photos
        env:
          GDRIVE_SA_JSON: ${{ secrets.GDRIVE_SA_JSON }}
          PHOTOS_FOLDER_ID: ${{ secrets.PHOTOS_FOLDER_ID }}
          PHOTOS_PASSWORD: ${{ secrets.PHOTOS_PASSWORD }}
        run: |
          if [ -n "$PHOTOS_PASSWORD" ]; then
            pip install --quiet pillow pillow-heif cryptography google-auth requests
            # A photo failure must not stop the prices and forecast from publishing.
            python scripts/photos.py _site || { echo "::warning::Photos failed; publishing without them."; rm -rf _site/photos; }
          else
            echo "Photos not set up yet; skipping."
          fi

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Publishing sometimes fails with "No artifacts named github-pages were found", a GitHub-side hiccup.
      # Try once more after a minute before giving up.
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true

      - name: Pause before retrying the publish
        if: steps.deploy.outcome == 'failure'
        run: sleep 60

      - id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
